# Neo Antigene defaults.
#
# Weights are PRIORS, not fitted values. Replace them with the output of
# `neoantigene refit` as soon as assay labels exist.

variant_filters:
  require_pass: true
  min_tumor_depth: 20
  min_dna_vaf: 0.05
  max_population_af: 0.0001
  min_ccf: 0.6
  tumor_purity: 0.5

expression:
  min_tpm: 1.0
  min_rna_vaf: 0.02
  require_rna_evidence: false
  normal_tpm_ceiling: null

peptides:
  lengths: [8, 9, 10, 11]
  flank_length: 10
  drop_self_matching: true

presentation:
  backend: mhcflurry
  max_affinity_percentile: 2.0
  min_presentation_score: 0.0
  score_wildtype: true

# PRIORS, not fitted values, and not tuned against any benchmark. Each weight
# is scaled by how well the literature actually supports it; every citation is
# in docs/CITATIONS.md with a DOI, and the ones that turned out NOT to support
# the claim commonly made for them are recorded there too.
#
# Frozen before the Ott et al. 2017 benchmark was run. If you change these,
# say so, because a weight chosen after seeing benchmark output is a fitted
# parameter wearing a prior's clothes.
weights:
  bias: -3.0

  # Presentation gates everything downstream. TESLA's two-stage architecture
  # treats it as the first filter, and binding affinity had the smallest
  # p-value of any presentation feature they tested (p = 4e-6).
  presentation: 2.5

  # Clonal neoantigens track survival and checkpoint response; subclonal ones
  # do not (McGranahan 2016). Ghorani 2018 saw the agretopicity effect only in
  # clonal peptides, which argues for keeping this above the proxy terms.
  clonality: 1.5

  # TESLA: immunogenic pMHC had significantly higher tumor abundance (p = 0.01),
  # and half of the immunogenic peptides their filter wrongly discarded were
  # lost to low abundance.
  expression: 1.2

  # Recognition-stage terms. TESLA's recognition criterion was low agretopicity
  # OR high foreignness, so both earn a real but modest weight.
  agretopicity: 0.5
  tumor_selectivity: 0.4
  self_dissimilarity: 0.25

  # A cheaper stand-in for self-dissimilarity, kept below it because the
  # literature grounds the proteome-wide version, not this one.
  wt_dissimilarity: 0.15

  # Near zero: Capietto 2020 shows position matters but not in which
  # direction, and TESLA found it useless for filtering.
  mutation_exposure: 0.1

  # Zero: Chowell 2015 (viral/self epitopes) and TESLA (tumor neoepitopes)
  # disagree on the sign. Still computed and reported, so `refit` can settle it.
  hydrophobicity: 0.0

output:
  top_n: 50
  max_per_variant: 2

  # Frameshifts earn more of the shortlist than substitutions do. The cap
  # exists to stop one variant filling the list with overlapping registers of
  # the same hypothesis; downstream of a frameshift the extra peptides are
  # distinct hypotheses instead. Roudko 2020 observed single recurrent MSI
  # frameshifts yielding several independently immunogenic epitopes. 6 is a
  # deliberate choice, not a fitted one — the evidence says "several".
  max_per_frameshift_variant: 6

  include_failed: false
